name: Test and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - name: Install Linux test desktops
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends xvfb x11-utils openbox weston xdotool wayland-utils
      - name: Electron integration (Windows and macOS)
        if: runner.os != 'Linux'
        run: npm run test:integration
      - name: Electron integration (Linux X11)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24" sh scripts/x11-test.sh npx playwright test
      - name: Save X11 test diagnostics
        if: failure() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: StudyRoom-X11-diagnostics
          path: test-results/
          if-no-files-found: ignore
      - name: Electron integration (Linux Wayland)
        if: runner.os == 'Linux'
        run: sh scripts/wayland-test.sh npx playwright test
      - name: Save test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: StudyRoom-${{ matrix.os }}-diagnostics
          path: test-results/
          if-no-files-found: ignore
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package Linux
        if: runner.os == 'Linux'
        run: npm run dist:linux
      - name: Package macOS
        if: runner.os == 'macOS'
        run: npm run dist:mac
      - name: Smoke test packaged app (Windows and macOS)
        if: runner.os != 'Linux'
        run: node scripts/package-smoke.mjs
      - name: Smoke test packaged app (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum sh scripts/x11-test.sh node scripts/package-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: StudyRoom-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.dmg
          if-no-files-found: error
