name: Test and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
      - name: Electron integration (Windows)
        if: runner.os == 'Windows'
        run: npm run test:integration
      - name: Electron integration (Linux X11)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:integration
      - name: Install Wayland test compositor
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends weston
      - name: Electron integration (Linux Wayland)
        if: runner.os == 'Linux'
        run: sh scripts/wayland-test.sh npx playwright test
      - name: Package Windows
        if: runner.os == 'Windows'
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Package Linux
        if: runner.os == 'Linux'
        run: npm run dist:linux
      - uses: actions/upload-artifact@v4
        with:
          name: StudyRoom-${{ runner.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.deb
          if-no-files-found: error
